name: Build and Deploy to Netlify

on:
  push:
    branches:
      - "main"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "main"

# Cancel outdated runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.2.1

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.2.1
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: "npm version ${{ steps.gitversion.outputs.fullSemVer }} --no-git-tag-version"

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "dist"
          path: "./dist"
          retention-days: 7

    outputs:
      version: ${{ steps.gitversion.outputs.fullSemVer }}

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: preview
      url: ${{ steps.netlify.outputs.deploy-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: "dist"
          path: "./dist"

      - name: Deploy preview to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./dist"
          production-deploy: false
          deploy-message: "Deploy preview from GitHub Actions (v${{ needs.build.outputs.version }})"
        env:
          NETLIFY_AUTH_TOKEN: "${{ secrets.NETLIFY_AUTH_TOKEN }}"
          NETLIFY_SITE_ID: "${{ secrets.NETLIFY_SITE_ID }}"
        timeout-minutes: 5

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: production
      url: ${{ steps.netlify.outputs.deploy-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: "dist"
          path: "./dist"

      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./dist"
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions (v${{ needs.build.outputs.version }})"
        env:
          NETLIFY_AUTH_TOKEN: "${{ secrets.NETLIFY_AUTH_TOKEN }}"
          NETLIFY_SITE_ID: "${{ secrets.NETLIFY_SITE_ID }}"
        timeout-minutes: 5

  cleanup:
    name: Prune old Netlify deploys
    runs-on: ubuntu-latest
    needs: deploy-production
    # Only after publishing an OFFICIAL release (tag) — never on preview deploys.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Keep last 3 releases + latest preview, delete the rest
        env:
          NETLIFY_AUTH_TOKEN: "${{ secrets.NETLIFY_AUTH_TOKEN }}"
          NETLIFY_SITE_ID: "${{ secrets.NETLIFY_SITE_ID }}"
          KEEP_STABLE: "3" # tagged production deploys to retain (incl. the one just released)
          KEEP_PREVIEW: "1" # most recent preview (draft) deploy to retain
        run: |
          set -euo pipefail
          api="https://api.netlify.com/api/v1"
          auth="Authorization: Bearer ${NETLIFY_AUTH_TOKEN}"

          deploys="$(curl -fsS -H "$auth" "$api/sites/${NETLIFY_SITE_ID}/deploys?per_page=100")"

          # IDs to delete:
          #  - production (draft=false, ready) beyond the newest $KEEP_STABLE
          #  - previews (draft=true) beyond the newest $KEEP_PREVIEW
          ids="$(printf '%s' "$deploys" | jq -r \
            --argjson keep_stable "$KEEP_STABLE" \
            --argjson keep_preview "$KEEP_PREVIEW" '
            ( [ .[] | select(.draft == false and .state == "ready") ]
                | sort_by(.created_at) | reverse | .[$keep_stable:] | .[].id ),
            ( [ .[] | select(.draft == true) ]
                | sort_by(.created_at) | reverse | .[$keep_preview:] | .[].id )
          ')"

          if [ -z "$ids" ]; then echo "Nothing to prune."; exit 0; fi

          while IFS= read -r id; do
            [ -n "$id" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "$auth" "$api/deploys/${id}")"
            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              echo "Deleted $id"
            else
              echo "::warning::Could not delete $id (HTTP $code)"
            fi
          done <<< "$ids"
