# Dependabot version updates (in addition to Dependabot security updates,
# which run automatically). Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One grouped PR for routine minor/patch bumps to keep noise low;
      # major bumps still come as individual PRs so they can be reviewed on their own.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows (keeps the pinned SHAs current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
